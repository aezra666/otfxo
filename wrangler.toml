name = "otfxo"
main = "worker.js"
compatibility_date = "2025-01-01"
keep_vars = true

# Serve index.html / script.js / style.css from the repo root.
# run_worker_first = true runs worker.js on every request (needed for visit logging),
# then it hands non-API requests to the static files.
[assets]
directory = "./"
binding = "ASSETS"
run_worker_first = true

# DISCORD_WEBHOOK is a secret, NOT set here. Add it with:
#   npx wrangler secret put DISCORD_WEBHOOK
# and paste your webhook URL when prompted.
