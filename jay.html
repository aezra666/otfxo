<html lang="en">
<head>
<meta charset="UTF-8">

<style>
:root {
    --active-banner: none;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'IBM Plex Mono';
}

html {
    background:  #070606;
}

body {
    background: blur;
  background-image: none;
  background-position: center;
  background-size: 100% 100%;
  background-repeat: no-repeat;
  background-attachment: fixed;
  min-width: 100%;
  min-height: 100vh;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    color: rgb(107, 42, 42);
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  opacity: 0.7;
  background-image:
    radial-gradient(circle at 8% 18%, rgba(255, 255, 255, 0.8) 0 1px, transparent 1.5px),
    radial-gradient(circle at 24% 72%, rgba(172, 117, 255, 0.7) 0 1px, transparent 1.5px),
    radial-gradient(circle at 42% 35%, rgba(255, 255, 255, 0.6) 0 1px, transparent 1.5px),
    radial-gradient(circle at 67% 16%, rgba(202, 166, 255, 0.65) 0 1px, transparent 1.5px),
    radial-gradient(circle at 88% 78%, rgba(255, 255, 255, 0.65) 0 1px, transparent 1.5px),
    radial-gradient(circle at 76% 54%, rgba(170, 110, 255, 0.55) 0 1px, transparent 1.5px);
  animation: particle-drift 12s ease-in-out infinite alternate;
}

@keyframes particle-drift {
  from {
    transform: translate3d(0, 0, 0);
    opacity: 0.45;
  }
  to {
    transform: translate3d(0, -8px, 0);
    opacity: 0.8;
  }
}

.intro-panel {
  position: fixed;
  inset: 0;
  background: #000000;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  opacity: 1;
  transition: opacity 0.8s ease;
}

.intro-panel.hidden {
  opacity: 0;
  pointer-events: none;
}

.intro-content {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 15px;
  max-width: 800px;
  padding: 20px;
}

.intro-content.console-mode {
  align-items: stretch;
  width: min(560px, calc(100vw - 40px));
  height: auto;
  min-height: min(275px, calc(100vh - 40px));
  padding: 0 30px 20px;
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 20px;
  background-color: #0d0e14;
  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.72);
}

.terminal-header {
  display: none;
}

.console-mode .terminal-header {
  display: flex;
  align-items: center;
  gap: 7px;
  height: 52px;
  margin: 0 -30px 12px;
  padding: 0 22px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  background: rgba(10, 10, 14, 0.6);
}

.terminal-badge {
  padding: 3px 10px;
  border: 1px solid rgba(90, 200, 230, 0.4);
  border-radius: 6px;
  color: rgba(130, 210, 255, 0.9);
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: 0.05em;
}

.console-mode .intro-text-box {
  display: flex;
  align-items: flex-start;
  gap: 14px;
}

.code-gutter {
  display: flex;
  flex-direction: column;
  color: rgba(255, 255, 255, 0.25);
  font-size: 0.78rem;
  line-height: 1.45;
  text-align: right;
  user-select: none;
  flex-shrink: 0;
}

.code-gutter span {
  display: block;
}

.line-cursor {
  display: inline-block;
  width: 0.55ch;
  height: 1em;
  margin-left: 2px;
  background: #39ff14;
  vertical-align: -0.15em;
  animation: typewriter-cursor 0.7s infinite;
}

.terminal-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #666;
}

.terminal-dot:first-child {
  background: #ff0000;
}

.terminal-dot:nth-child(2) {
  background: #febc2e;
}

.terminal-dot:nth-child(3) {
  background: #28c840;
}

.terminal-title {
  flex: 1;
  margin-left: 6px;
  color: rgba(255, 255, 255, 0.35);
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.3em;
  text-align: left;
  text-transform: uppercase;
}



.console-mode .intro-logo {
  display: none;
}

.console-mode .intro-text-box {
  flex: none;
  justify-content: flex-start;
  min-height: 0;
}

.console-mode .intro-typewriter {
  width: 100%;
  margin: 0;
  padding: 0;
  border-right: 0;
  text-align: left;
  white-space: pre-wrap;
  min-height: 0;
  line-height: 1.45;
  color: #e6edf3;
  font-size: 0.78rem;
  text-shadow: none;
}
/* real console — interactive prompt */
.terminal-input-line {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
  padding: 6px 0 0;
  border-top: 1px solid rgba(255,255,255,0.08);
  font-family: 'Courier Prime', monospace;
  font-size: 0.78rem;
  line-height: 1.45;
}
.terminal-prompt {
  color: #39ff14;
  text-shadow: 0 0 5px rgba(57,255,20,0.9), 0 0 10px rgba(57,255,20,0.45);
  white-space: nowrap;
  user-select: none;
}
.terminal-cmd-input {
  flex: 1;
  min-width: 0;
  background: transparent;
  border: 0;
  outline: 0;
  color: #e6edf3;
  font: inherit;
  caret-color: #39ff14;
}
.terminal-cmd-input::placeholder { color: rgba(230,237,243,0.25); }
.console-mode .intro-content {
  max-height: min(70vh, 520px);
  overflow: hidden;
}
.console-mode .intro-text-box {
  flex: 1;
  overflow-y: auto;
  max-height: 300px;
  scrollbar-width: thin;
  scrollbar-color: rgba(57,255,20,0.3) transparent;
}
.console-mode .intro-text-box::-webkit-scrollbar { width: 6px; }
.console-mode .intro-text-box::-webkit-scrollbar-thumb { background: rgba(57,255,20,0.3); border-radius: 999px; }
.term-line { white-space: pre-wrap; word-break: break-word; }
.term-cmd { color: #e6edf3; }
.term-out { color: rgba(230,237,243,0.9); }
.term-ok { color: #39ff14; text-shadow: 0 0 5px rgba(57,255,20,0.8); }
.term-err { color: #ff6b6b; }
.term-dim { color: rgba(230,237,243,0.55); }

.intro-logo img {
  width: 300px;
  height: 300px;
  align-items: center;
  object-fit: contain;
  margin-bottom: -20px;
}

.intro-avatar-wrap {
  display: flex;
  justify-content: center;
  align-items: center;
  margin: 10px 0 16px;
}
.intro-avatar-frame {
  position: relative;
  width: 118px;
  height: 118px;
  flex-shrink: 0;
  display: none;
}
.intro-avatar-frame.loaded { display: block; }
.intro-avatar {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
  display: block;
  background: #111;
  border: 2px solid var(--accent-color, #b980ff);
  box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent-color, #b980ff) 18%, transparent), 0 0 18px color-mix(in srgb, var(--accent-color, #b980ff) 35%, transparent);
}
.intro-avatar-deco {
  position: absolute;
  inset: -14%;
  width: 128%;
  height: 128%;
  max-width: none;
  border-radius: 0;
  object-fit: contain;
  pointer-events: none;
  z-index: 2;
  display: none;
  border: none;
  box-shadow: none;
  background: transparent;
}
/* keep avatar visible in console — intro must be discord avatar */
.console-mode .intro-avatar-wrap { display: flex; margin: 8px 0 12px; }
.console-mode .intro-avatar-frame { width: 86px; height: 86px; }

.intro-text-box {
  min-height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.intro-typewriter {
  font-family: 'Courier Prime', monospace;
  align-items: center;
  font-size: 1.1rem;
  color: #ffffff;
  border-right: 2px solid #ffffff;
  text-align: left;
  min-height: 60px;
  padding: 20px;
  animation: typewriter-cursor 0.7s infinite;
  margin-bottom: auto;
  margin-top: 10px;
  white-space: pre-wrap;
}

@keyframes otfxo-shake {
  0% { transform: translate(0, 0); }
  20% { transform: translate(-1px, 1px); }
  40% { transform: translate(1px, -1px); }
  60% { transform: translate(-1px, -1px); }
  80% { transform: translate(1px, 1px); }
  100% { transform: translate(0, 0); }
}

.scramble-character.letter-shake {
  animation: otfxo-shake 0.15s linear infinite;
  color: #39ff14;
  text-shadow: 0 0 6px rgba(57, 255, 20, 0.95), 0 0 14px rgba(57, 255, 20, 0.6);
}

.scramble-character {
  display: inline-block;
  min-width: 0.55ch;
  color: #e6edf3;
}

.scramble-character.scramble-break {
  display: block;
  height: 0;
  min-width: 0;
}

.intro-typewriter:not(.typing) .scramble-character {
  color: inherit;
}

.console-mode .intro-typewriter .scramble-character.ok-character {
  color: #39ff14;
  text-shadow: 0 0 5px rgba(57, 255, 20, 0.9), 0 0 12px rgba(57, 255, 20, 0.55);
}

.intro-proceed {
  font-family: 'Courier Prime', monospace;
  font-size: 1rem;
  padding: 15px 40px;
  background: transparent;
  border: 2px solid #ffffff;
  color: #ffffff;
  cursor: pointer;
  transition: all 0.3s ease;
  letter-spacing: 2px;
  font-weight: bold;
  margin-top: 5px;
}

.intro-proceed:disabled {
  opacity: 0.3;
  cursor: not-allowed;
  border-color: rgba(255, 255, 255, 0.3);
}

.intro-proceed:enabled {
  opacity: 1;
  cursor: pointer;
}

.intro-proceed:enabled:hover {
  background: #ffffff;
  color: #000000;
  box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
  transform: scale(1.05);
}

/* never shown on the console screen */
.console-mode .intro-proceed {
  display: none;
}

.intro-credit {
  font-family: 'Courier Prime', monospace;
  font-size: 0.9rem;
  color: #ffffff;
  font-style: italic;
  opacity: 0.7;
  margin-top: 10px;
}

/* ---------- personal page additions ---------- */
.bg {
  position: fixed; inset: 0; z-index: 0;
  background: center/cover no-repeat;
  filter: blur(var(--scene-blur, 6px)) brightness(0.4);
  transform: scale(1.1);
}
.stage {
  position: fixed; inset: 0; z-index: 2;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity 1s ease;
}
.stage.show { opacity: 1; pointer-events: auto; }

.card-wrap {
  position: relative;
  width: min(330px, calc(100vw - 32px));
  height: 410px;
  transform: translateY(10px) scale(0.98);
  transition: transform 0.8s cubic-bezier(.2,.8,.2,1);
}
.stage.show .card-wrap { transform: translateY(0) scale(1); }
.solo-card {
  position: absolute; inset: 0;
  border-radius: 22px; overflow: hidden;
  background: rgb(8 9 12 / var(--card-alpha, 0.38));
  border: 1px solid transparent;
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.18);
}
.card-edge {
  position: absolute; inset: 0; width: 100%; height: 100%;
  overflow: visible; pointer-events: none; z-index: 5;
  filter: drop-shadow(0 0 calc(var(--neon-glow, 28px) * 0.5) color-mix(in srgb, var(--accent-color, #b980ff) 70%, transparent))
          drop-shadow(0 0 var(--neon-glow, 28px) color-mix(in srgb, var(--accent-color, #b980ff) 45%, transparent));
}
.card-edge path { fill: none; stroke: color-mix(in srgb, var(--accent-color, #b980ff) 80%, transparent); stroke-width: 1.2; stroke-linejoin: round; }
.solo-card .media-slot { position:absolute; inset:0; z-index:1; overflow:hidden; border-radius:22px; }
.solo-card .media-img { display:none; }
.solo-card::after { content:''; position:absolute; inset:0; z-index:2; background:transparent; pointer-events:none; border-radius:22px; }
.solo-inner { position:relative; z-index:3; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:34px 28px 28px; gap:18px; text-align:center; }
.solo-avatar { position:relative; width:118px; height:118px; border-radius:50%; background:#111; flex-shrink:0; border:2px solid var(--accent-color, #b980ff); box-shadow:0 0 0 7px color-mix(in srgb, var(--accent-color, #b980ff) 22%, transparent), 0 0 var(--neon-glow, 28px) color-mix(in srgb, var(--accent-color, #b980ff) 46%, transparent), 0 14px 34px rgba(0,0,0,0.42); }
.solo-avatar img { width:100%; height:100%; border-radius:50%; object-fit:cover; }
.solo-avatar .solo-decoration { position:absolute; inset:-14%; width:128%; height:128%; max-width:none; border-radius:0; object-fit:contain; pointer-events:none; z-index:4; display:none; border:none; box-shadow:none; background:transparent; }
.solo-dot { position:absolute; bottom:4px; right:4px; width:17px; height:17px; border-radius:50%; border:3px solid #111; background:#80848e; z-index:5; }
.status-online{background:#23a55a;}.status-idle{background:#f0b232;}.status-dnd{background:#f23f43;}.status-offline{background:#80848e;}
.solo-info { color:#fff; text-shadow:0 0 12px rgba(255,255,255,0.35); }
.solo-name { font-size:28px; letter-spacing:1px; font-weight:700; }
.solo-user { margin-top:5px; font-size:12px; opacity:0.62; font-style:italic; }
.solo-status { display:inline-block; margin-top:14px; padding:5px 10px; border:1px solid color-mix(in srgb, var(--accent-color, #b980ff) 70%, transparent); border-radius:999px; font-size:11px; opacity:0.9; color:var(--accent-color, #b980ff); background:color-mix(in srgb, var(--accent-color, #b980ff) 12%, transparent); box-shadow:0 0 14px color-mix(in srgb, var(--accent-color, #b980ff) 26%, transparent); }
.solo-act { margin-top:16px; font-size:12px; }
.solo-act .a-det { display:block; font-size:11px; opacity:0.6; }
.back { position:fixed; top:18px; left:18px; z-index:60; color:#5a6472; text-decoration:none; font-size:0.8rem; }
.back:hover { color:#fff; }

.visual-tools { position:fixed; top:18px; left:86px; z-index:60; }
.visual-toggle { width:36px; height:36px; border:1px solid rgba(255,255,255,0.28); border-radius:10px; background:rgba(8,9,12,0.58); color:#fff; cursor:pointer; font-size:17px; backdrop-filter:blur(12px); transition:transform 0.35s ease, background 0.35s ease, box-shadow 0.35s ease; }
.visual-toggle:hover { background:rgba(255,255,255,0.14); transform:rotate(22deg) scale(1.06); }
.visual-toggle { box-shadow:0 0 16px color-mix(in srgb, var(--accent-color, #b980ff) 36%, transparent); }
.visual-tools.open .visual-toggle { transform:rotate(90deg); background:rgba(255,255,255,0.14); }
.visual-panel { visibility:hidden; opacity:0; transform:translateY(-8px) scale(0.96); pointer-events:none; width:220px; margin-top:8px; padding:16px; border:1px solid rgba(255,255,255,0.18); border-radius:14px; background:rgba(8,9,12,0.82); color:#fff; box-shadow:0 18px 50px rgba(0,0,0,0.45); backdrop-filter:blur(18px); transition:opacity 0.25s ease, transform 0.25s ease, visibility 0.25s ease; }
.visual-tools.open .visual-panel { visibility:visible; opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }
.visual-title { margin-bottom:14px; color:rgba(255,255,255,0.55); font-size:10px; letter-spacing:0.18em; text-transform:uppercase; }
.visual-control { display:grid; gap:7px; margin-top:13px; }
.visual-control label { display:flex; justify-content:space-between; color:rgba(255,255,255,0.7); font-size:10px; letter-spacing:0.08em; text-transform:uppercase; }
.visual-control output { color:#fff; }
.visual-control input { width:100%; accent-color:#fff; cursor:pointer; }
.visual-check { display:flex; align-items:center; justify-content:space-between; margin-top:13px; color:rgba(255,255,255,0.7); font-size:10px; letter-spacing:0.08em; text-transform:uppercase; }
.visual-check input { width:14px; height:14px; accent-color:var(--accent-color, #b980ff); }
.accent-row { display:flex; gap:8px; margin-top:13px; }
.accent-swatch { width:16px; height:16px; padding:0; border:2px solid transparent; border-radius:50%; cursor:pointer; }
.accent-swatch.active { border-color:#fff; box-shadow:0 0 0 2px rgba(255,255,255,0.18); }
.accent-picker { width:18px; height:18px; padding:0; border:0; border-radius:50%; overflow:hidden; cursor:pointer; background:conic-gradient(red, yellow, lime, aqua, blue, magenta, red); }
.accent-picker::-webkit-color-swatch-wrapper { padding:0; }
.accent-picker::-webkit-color-swatch { border:2px solid rgba(255,255,255,0.8); border-radius:50%; }
.visual-reset { margin-top:15px; padding:0; border:0; background:none; color:rgba(255,255,255,0.42); cursor:pointer; font:inherit; font-size:9px; letter-spacing:0.12em; text-transform:uppercase; }
.visual-reset:hover { color:#fff; }
body.crt-mode::after { content:''; position:fixed; inset:0; z-index:50; pointer-events:none; opacity:0.16; background:repeating-linear-gradient(0deg, transparent 0 3px, rgba(255,255,255,0.12) 4px); mix-blend-mode:screen; }
body.reduced-motion *, body.reduced-motion *::before, body.reduced-motion *::after { animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; }

/* code-drawn eye visitor counter */
.eye-counter { position:absolute; top:12px; right:12px; z-index:4; display:flex; align-items:center; gap:7px; padding:5px 10px 5px 7px; border:1px solid color-mix(in srgb, var(--accent-color, #b980ff) 55%, transparent); border-radius:999px; background:rgba(8,9,12,0.58); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); box-shadow:0 0 16px color-mix(in srgb, var(--accent-color, #b980ff) 30%, transparent); color:#fff; font-size:10.5px; letter-spacing:0.07em; }
.eye-counter svg { width:23px; height:14px; overflow:visible; }
.eye-counter .eye-lid { fill:none; stroke:var(--accent-color, #b980ff); stroke-width:1.6; stroke-linecap:round; }
.eye-counter .eye-iris { fill:color-mix(in srgb, var(--accent-color, #b980ff) 35%, transparent); stroke:var(--accent-color, #b980ff); stroke-width:1.2; }
.eye-counter .eye-pupil { fill:var(--accent-color, #b980ff); }
.eye-counter .eye-shine { fill:#fff; opacity:0.9; }
.eye-counter .eye { transform-origin:13px 8px; animation: eye-blink 5.5s ease-in-out infinite; }
.eye-counter .eye-look { animation: eye-look 9s ease-in-out infinite; }
@keyframes eye-blink { 0%, 92%, 100% { transform:scaleY(1); } 95% { transform:scaleY(0.08); } }
@keyframes eye-look { 0%, 35%, 100% { transform:translateX(0); } 45%, 60% { transform:translateX(3px); } 70%, 85% { transform:translateX(-3px); } }
.eye-counter output { min-width:2ch; text-align:right; font-variant-numeric:tabular-nums; }

@media (max-width: 520px) {
  .card-wrap { height:390px; }
  .solo-inner { padding-inline:22px; }
}

</style>

        <svg viewBox="0 0 26 16" aria-hidden="true">
          <g class="eye">
            <path class="eye-lid" d="M1 8 C6 1.5, 20 1.5, 25 8 C20 14.5, 6 14.5, 1 8 Z"/>
            <g class="eye-look">
              <circle class="eye-iris" cx="13" cy="8" r="4.2"/>
              <circle class="eye-pupil" cx="13" cy="8" r="2"/>
              <circle class="eye-shine" cx="14.4" cy="6.6" r="0.8"/>
            </g>
          </g>
        </svg>
        <output id="visitCount">&middot;&middot;&middot;</output>
      </div>
    </div>
    <svg class="card-edge" aria-hidden="true"><path id="cardEdgePath" d=""/></svg>
    </div>
  </div>

  <div class="visual-tools">
    <button class="visual-toggle" type="button" aria-label="Open visual settings" aria-expanded="false">&#9881;</button>
    <div class="visual-panel">
      <div class="visual-title">Visual tuning</div>
      <div class="visual-control">
        <label for="scene-blur">Scene blur <output id="scene-blur-value">6px</output></label>
        <input id="scene-blur" type="range" min="0" max="16" step="1" value="6">
      </div>
      <div class="visual-control">
        <label for="card-alpha">Panel glass <output id="card-alpha-value">38%</output></label>
        <input id="card-alpha" type="range" min="15" max="90" step="1" value="38">
      </div>
      <div class="visual-control">
        <label for="neon-glow">Neon glow <output id="neon-glow-value">28px</output></label>
        <input id="neon-glow" type="range" min="0" max="60" step="1" value="28">
      </div>
      <div class="visual-control">
        <label for="music-volume">Volume <output id="music-volume-value">50%</output></label>
        <input id="music-volume" type="range" min="0" max="100" step="1" value="50">
      </div>
      <label class="visual-check">CRT texture <input id="crt-effect" type="checkbox"></label>
      <label class="visual-check">Reduce motion <input id="reduce-motion" type="checkbox"></label>
      <label class="visual-check">Mute audio <input id="mute-audio" type="checkbox"></label>
      <div class="visual-title" style="margin-top:16px;margin-bottom:0;">Accent tone</div>
      <div class="accent-row" role="group" aria-label="Accent tone">
        <button class="accent-swatch active" type="button" data-accent="#b980ff" style="background:#b980ff" aria-label="Violet accent"></button>
        <button class="accent-swatch" type="button" data-accent="#72d8ff" style="background:#72d8ff" aria-label="Sky accent"></button>
        <button class="accent-swatch" type="button" data-accent="#ff6d9e" style="background:#ff6d9e" aria-label="Rose accent"></button>
        <button class="accent-swatch" type="button" data-accent="#b6f36b" style="background:#b6f36b" aria-label="Lime accent"></button>
        <button class="accent-swatch" type="button" data-accent="#ffffff" style="background:#ffffff" aria-label="White accent"></button>
        <input class="accent-picker" id="accent-picker" type="color" value="#b980ff" aria-label="Choose custom accent color">
      </div>
      <button class="visual-reset" type="button" id="visual-reset">Reset appearance</button>
    </div>
  </div>

  <audio id="music" loop></audio>

<script src="eye.js?v=23cad26"></script>
</body>
</html>
