body.crt-mode::after { content:''; position:fixed; inset:0; z-index:0; pointer-events:none; opacity:0.28; background:repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0 1px, rgba(0,0,0,0.22) 1px 3px), repeating-linear-gradient(90deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 4px); mix-blend-mode:screen; background-attachment: fixed; animation: none; }
body.reduced-motion *, body.reduced-motion *::before, body.reduced-motion *::after { animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; }



@media (max-width: 520px) {
  .card-wrap { height:390px; }
  .solo-inner { padding-inline:22px; }
}

<body>
  <span class="custom-cursor" id="custom-cursor" aria-hidden="true"></span>
  <div class="bg" id="bg"></div>
  <!-- PER PERSON: change data-user-id, data-banner, data-music on #stage -->
  <div class="bg" id="bg"></div>

  <div id="intro-panel" class="intro-panel active">
    <div class="intro-content">
      <div class="terminal-header" aria-hidden="true">
        <span class="terminal-dot"></span>
        <span class="terminal-dot"></span>
        <span class="terminal-dot"></span>
        <span class="terminal-title">~/otfxo/world</span>
        <span class="terminal-badge">SH</span>
      </div>
      <div class="intro-avatar-wrap">
        <div id="intro-avatar-frame" class="intro-avatar-frame">
          <img id="intro-avatar" class="intro-avatar" src="" alt="avatar">
          <img id="intro-avatar-deco" class="intro-avatar-deco" src="" alt="">
        </div>
      </div>
      <div class="terminal-input-line" id="terminal-input-line" style="display:none">
        <span class="terminal-prompt">guest@otfxo:~$</span>
        <input type="text" class="terminal-cmd-input" id="terminal-cmd-input" autocomplete="off" spellcheck="false" autocorrect="off" autocapitalize="off" placeholder="">
      </div>
      <button class="intro-proceed" disabled="">ENTER</button>
    </div>
  </div>

<a class="back" href="/">&larr; back</a>



  <div class="stage" id="stage"
      data-user-id="1483321828838477966">
    <div class="card-wrap">
    <div class="solo-card">
      <div class="solo-inner">
        <div class="solo-avatar"><img id="avatar" src=""><img id="avatarDeco" class="solo-decoration" src="" alt=""><span class="solo-dot" id="dot"></span></div>
        <div class="solo-info">
          <div class="solo-name" id="name">…</div>
          <div class="solo-user" id="uname"></div>
          <div class="solo-status" id="statusBox"></div>
          <div class="solo-act"><span id="actName"></span><span class="a-det" id="actDet"></span></div>
        </div>
      </div>
      <span class="visitor-eye top-visitor-eye" title="Visitors" aria-label="Visitors">
        <svg viewBox="0 0 26 16" aria-hidden="true">
          <path class="visitor-eye-lid" d="M1 8 C6 1.5, 20 1.5, 25 8 C20 14.5, 6 14.5, 1 8 Z"/>
          <circle class="visitor-eye-iris" cx="13" cy="8" r="4.2"/>
          <circle class="visitor-eye-pupil" cx="13" cy="8" r="2"/>
          <circle class="visitor-eye-shine" cx="14.4" cy="6.6" r="0.8"/>
        </svg>
        <output class="visitor-count">1</output>
      </span>
      <div class="card-back" aria-label="Social links">
        <div class="card-back-title">Connect</div>
        <nav class="social-links" aria-label="Social links">
          <!-- Replace each data-icon value with your icon image URL. Add has-icon to show it. -->
          <a class="social-link has-icon" href="https://instagram.com/parengj" target="_blank" rel="noreferrer" aria-label="Instagram" title="Instagram"><img class="social-icon" data-icon="https://cdn.simpleicons.org/instagram/ffffff" alt=""><span class="social-fallback">IG</span></a>
          <a class="social-link has-icon" href="https://discord.com/users/1483321828838477966" target="_blank" rel="noreferrer" aria-label="Discord" title="Discord"><img class="social-icon" data-icon="https://cdn.simpleicons.org/discord/ffffff" alt=""><span class="social-fallback">DC</span></a>
          <a class="social-link has-icon" href="https://open.spotify.com/" target="_blank" rel="noreferrer" aria-label="Spotify" title="Spotify"><img class="social-icon" data-icon="https://cdn.simpleicons.org/spotify/ffffff" alt=""><span class="social-fallback">SP</span></a>
        </nav>
        <span class="card-back-hint">Click to return</span>
      </div>
    </div>
    <svg class="card-edge" aria-hidden="true"><path id="cardEdgePath" d=""/></svg>
    </div>
  </div>

  <div class="audio-player" id="audio-player" aria-label="Music player">
    <div class="audio-controls">
      <button class="audio-skip is-back" type="button" data-audio-action="back" aria-label="Restart track"></button>
      <button class="audio-play is-playing" type="button" data-audio-action="toggle" aria-label="Pause music" aria-pressed="true"></button>
      <button class="audio-skip is-forward" type="button" data-audio-action="forward" aria-label="Skip ahead"></button>
    </div>
    <label class="audio-volume" aria-label="Volume"><input id="audio-volume" type="range" min="0" max="1" step="0.01" value="0.8"></label>
    <div class="audio-meta">
      <strong class="audio-title" id="audio-title">zoe</strong>
      <div class="audio-progress" id="audio-progress" role="slider" aria-label="Track progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0"><span class="audio-progress-fill" id="audio-progress-fill"></span></div>
      <div class="audio-time"><span id="audio-current-time">0:00</span><span id="audio-duration">0:00</span></div>
    </div>
  </div>

  <audio id="music" loop></audio>

<script src="https://cdn.jsdelivr.net/npm/disable-devtool@0.3.9/disable-devtool.min.js"></script>
<script>
  if (typeof DisableDevtool === 'function') {
    const devtoolResult = DisableDevtool({
      disableMenu: true,
      clearLog: true,
      disableSelect: true,
      disableInputSelect: false,
      disableCopy: true,
      disableCut: true,
      disablePaste: true,
      detectors: 'all'
    });
    if (!devtoolResult.success) console.warn('DisableDevtool:', devtoolResult.reason);
  }
</script>
