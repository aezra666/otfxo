<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&amp;family=Playfair+Display:wght@400;600;700&amp;family=Orbitron:wght@400;600&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/disable-devtool@0.3.9/disable-devtool.min.js"></script>
    <script>
      if (typeof DisableDevtool === 'function') {
        const devtoolResult = DisableDevtool({
        disableMenu: true,
        clearLog: true,
        disableSelect: true,
        disableInputSelect: false,
        disableCopy: true,
        disableCut: true,
        disablePaste: true,
        detectors: 'all'
        });
        if (!devtoolResult.success) console.warn('DisableDevtool:', devtoolResult.reason);
      }
    </script>
    <script src="profile-config.js"></script>
    <script src="music.js" defer></script>
    <script src="script.js?v=c583c0a" defer></script>
    <link  rel="icon" type="img/png" href="https://file.garden/ap_Ebnzi9V7bLTDs/6212485181ca055f760855d98d3ee4bc.gif">
</head>
<body>
  <span class="custom-cursor" id="custom-cursor" aria-hidden="true"></span>
    <div class="blur-overlay"></div>

    <div id="intro-panel" class="intro-panel active">
        <div class="intro-content">
          <div class="terminal-header" aria-hidden="true">
            <span class="terminal-dot"></span>
            <span class="terminal-dot"></span>
            <span class="terminal-dot"></span>
            <span class="terminal-title">~/otfxo/world</span>
            <span class="terminal-badge">SH</span>

            <div class="intro-logo">
                <img src="https://file.garden/ap_Ebnzi9V7bLTDs/647D7A1D-FDCF-4AEA-AE2E-A665B29F306C.png" alt="logo">
            </div>
            <div class="intro-text-box">
                <div class="code-gutter"></div>
                <div class="intro-typewriter"></div>
            </div>
            <div class="terminal-input-line" id="terminal-input-line" style="display:none">
                <span class="terminal-prompt">guest@otfxo:~$</span>
                <input type="text" class="terminal-cmd-input" id="terminal-cmd-input" autocomplete="off" spellcheck="false" autocorrect="off" autocapitalize="off" placeholder="">
            </div>
            <button class="intro-proceed" disabled="">ENTER</button>
        </div>
    </div>

    <nav class="navbar">
        <div class="logo-container">
            <div class="logo-text">𝗢𝗧𝗙𝗫𝗢</div>
            <img class="logo-img" src="https://file.garden/ap_Ebnzi9V7bLTDs/647D7A1D-FDCF-4AEA-AE2E-A665B29F306C.png" alt="logo">
        </div>
        <span class="navbar-hint" aria-live="polite"></span>
        <button class="navbar-music-button" type="button" aria-label="Open music list" aria-expanded="false">&#9835;</button>
        <div class="music-menu" hidden>
          <div class="music-menu-heading">
            <span>Music</span>
            <button class="music-close" type="button" aria-label="Close music list">×</button>
          </div>
          <p class="music-status" aria-live="polite"></p>
          <div class="music-controls" aria-label="Playback controls">
            <button class="music-control-button" type="button" data-action="previous" aria-label="Previous song">&#124;&lt;</button>
            <button class="music-control-button music-play-button" type="button" data-action="play" aria-label="Play song">&#9654;</button>
            <button class="music-control-button" type="button" data-action="next" aria-label="Next song">&gt;&#124;</button>
          </div>
          <label class="music-volume">
            <span aria-hidden="true">VOL</span>
            <input type="range" min="0" max="1" step="0.01" value="0.35" aria-label="Volume">
          </label>
          <div class="music-track-list"></div>
        </div>
    </nav>
