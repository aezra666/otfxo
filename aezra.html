<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>aezra — otfxo</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&amp;family=Courier+Prime&amp;display=swap" rel="stylesheet">
<style>
:root {
    --active-banner: none;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'IBM Plex Mono';
}

html {
    background:  #070606;
}

body {
    background: blur;
  background-image: none;
  background-position: center;
  background-size: 100% 100%;
  background-repeat: no-repeat;
  background-attachment: fixed;
  min-width: 100%;
  min-height: 100vh;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    color: rgb(107, 42, 42);
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  opacity: 0.7;
  background-image:
    radial-gradient(circle at 8% 18%, rgba(255, 255, 255, 0.8) 0 1px, transparent 1.5px),
    radial-gradient(circle at 24% 72%, rgba(172, 117, 255, 0.7) 0 1px, transparent 1.5px),
    radial-gradient(circle at 42% 35%, rgba(255, 255, 255, 0.6) 0 1px, transparent 1.5px),
    radial-gradient(circle at 67% 16%, rgba(202, 166, 255, 0.65) 0 1px, transparent 1.5px),
    radial-gradient(circle at 88% 78%, rgba(255, 255, 255, 0.65) 0 1px, transparent 1.5px),
    radial-gradient(circle at 76% 54%, rgba(170, 110, 255, 0.55) 0 1px, transparent 1.5px);
  animation: particle-drift 12s ease-in-out infinite alternate;
}

@keyframes particle-drift {
  from {
    transform: translate3d(0, 0, 0);
    opacity: 0.45;
  }
  to {
    transform: translate3d(0, -8px, 0);
    opacity: 0.8;
  }
}

.intro-panel {
  position: fixed;
  inset: 0;
  background: #000000;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  opacity: 1;
  transition: opacity 0.8s ease;
}

.intro-panel.hidden {
  opacity: 0;
  pointer-events: none;
}

.intro-content {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 15px;
  max-width: 800px;
  padding: 20px;
}

.intro-content.console-mode {
  align-items: stretch;
  width: min(560px, calc(100vw - 40px));
  height: auto;
  min-height: min(275px, calc(100vh - 40px));
  padding: 0 30px 20px;
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 20px;
  background-color: #0d0e14;
  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.72);
}

.terminal-header {
  display: none;
}

.console-mode .terminal-header {
  display: flex;
  align-items: center;
  gap: 7px;
  height: 52px;
  margin: 0 -30px 12px;
  padding: 0 22px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  background: rgba(10, 10, 14, 0.6);
}

.terminal-badge {
  padding: 3px 10px;
  border: 1px solid rgba(90, 200, 230, 0.4);
  border-radius: 6px;
  color: rgba(130, 210, 255, 0.9);
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: 0.05em;
}

.console-mode .intro-text-box {
  display: flex;
  align-items: flex-start;
  gap: 14px;
}

.code-gutter {
  display: flex;
  flex-direction: column;
  color: rgba(255, 255, 255, 0.25);
  font-size: 0.78rem;
  line-height: 1.45;
  text-align: right;
  user-select: none;
  flex-shrink: 0;
}

.code-gutter span {
  display: block;
}

.line-cursor {
  display: inline-block;
  width: 0.55ch;
  height: 1em;
  margin-left: 2px;
  background: #39ff14;
  vertical-align: -0.15em;
  animation: typewriter-cursor 0.7s infinite;
}

.terminal-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #666;
}

.terminal-dot:first-child {
  background: #ff0000;
}

.terminal-dot:nth-child(2) {
  background: #febc2e;
}

.terminal-dot:nth-child(3) {
  background: #28c840;
}

.terminal-title {
  flex: 1;
  margin-left: 6px;
  color: rgba(255, 255, 255, 0.35);
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.3em;
  text-align: left;
  text-transform: uppercase;
}



.console-mode .intro-logo {
  display: none;
}

.console-mode .intro-text-box {
  flex: none;
  justify-content: flex-start;
  min-height: 0;
}

.console-mode .intro-typewriter {
  width: 100%;
  margin: 0;
  padding: 0;
  border-right: 0;
  text-align: left;
  white-space: pre-wrap;
  min-height: 0;
  line-height: 1.45;
  color: #e6edf3;
  font-size: 0.78rem;
  text-shadow: none;
}

.intro-logo img {
  width: 300px;
  height: 300px;
  align-items: center;
  object-fit: contain;
  margin-bottom: -20px;
}

.intro-text-box {
  min-height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.intro-typewriter {
  font-family: 'Courier Prime', monospace;
  align-items: center;
  font-size: 1.1rem;
  color: #ffffff;
  border-right: 2px solid #ffffff;
  text-align: left;
  min-height: 60px;
  padding: 20px;
  animation: typewriter-cursor 0.7s infinite;
  margin-bottom: auto;
  margin-top: -50px;
  white-space: pre-wrap;
}

@keyframes otfxo-shake {
  0% { transform: translate(0, 0); }
  20% { transform: translate(-1px, 1px); }
  40% { transform: translate(1px, -1px); }
  60% { transform: translate(-1px, -1px); }
  80% { transform: translate(1px, 1px); }
  100% { transform: translate(0, 0); }
}

.scramble-character.letter-shake {
  animation: otfxo-shake 0.15s linear infinite;
  color: #39ff14;
  text-shadow: 0 0 6px rgba(57, 255, 20, 0.95), 0 0 14px rgba(57, 255, 20, 0.6);
}

.scramble-character {
  display: inline-block;
  min-width: 0.55ch;
  color: #e6edf3;
}

.scramble-character.scramble-break {
  display: block;
  height: 0;
  min-width: 0;
}

.intro-typewriter:not(.typing) .scramble-character {
  color: inherit;
}

.console-mode .intro-typewriter .scramble-character.ok-character {
  color: #39ff14;
  text-shadow: 0 0 5px rgba(57, 255, 20, 0.9), 0 0 12px rgba(57, 255, 20, 0.55);
}

.intro-proceed {
  font-family: 'Courier Prime', monospace;
  font-size: 1rem;
  padding: 15px 40px;
  background: transparent;
  border: 2px solid #ffffff;
  color: #ffffff;
  cursor: pointer;
  transition: all 0.3s ease;
  letter-spacing: 2px;
  font-weight: bold;
  margin-top: 5px;
}

.intro-proceed:disabled {
  opacity: 0.3;
  cursor: not-allowed;
  border-color: rgba(255, 255, 255, 0.3);
}

.intro-proceed:enabled {
  opacity: 1;
  cursor: pointer;
}

.intro-proceed:enabled:hover {
  background: #ffffff;
  color: #000000;
  box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
  transform: scale(1.05);
}

/* never shown on the console screen */
.console-mode .intro-proceed {
  display: none;
}

.intro-credit {
  font-family: 'Courier Prime', monospace;
  font-size: 0.9rem;
  color: #ffffff;
  font-style: italic;
  opacity: 0.7;
  margin-top: 10px;
}

/* ---------- personal page additions ---------- */
.bg {
  position: fixed; inset: 0; z-index: 0;
  background: center/cover no-repeat;
  filter: blur(6px) brightness(0.4);
  transform: scale(1.1);
}
.stage {
  position: fixed; inset: 0; z-index: 2;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity 1s ease;
}
.stage.show { opacity: 1; pointer-events: auto; }

.solo-card {
  position: relative;
  width: min(620px, calc(100vw - 32px));
  height: 260px;
  border-radius: 18px; overflow: hidden;
  background: rgba(10,10,10,0.8);
  border: 1px solid rgba(255,255,255,0.35);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  box-shadow: 0 20px 60px rgba(0,0,0,0.6);
}
.solo-card .media-slot { position:absolute; inset:0; z-index:1; }
.solo-card .media-img { width:100%; height:100%; object-fit:cover; filter:brightness(0.4); }
.solo-inner { position:relative; z-index:3; height:100%; display:flex; align-items:center; padding:0 34px; gap:28px; }
.solo-avatar { position:relative; width:150px; height:150px; border-radius:50%; background:#111; flex-shrink:0; }
.solo-avatar img { width:100%; height:100%; border-radius:50%; object-fit:cover; }
.solo-dot { position:absolute; bottom:8px; right:8px; width:22px; height:22px; border-radius:50%; border:3px solid #111; background:#80848e; }
.status-online{background:#23a55a;}.status-idle{background:#f0b232;}.status-dnd{background:#f23f43;}.status-offline{background:#80848e;}
.solo-info { color:#fff; text-shadow:0 0 12px rgba(255,255,255,0.5); }
.solo-name { font-size:34px; letter-spacing:2px; font-weight:700; }
.solo-user { margin-top:4px; font-size:15px; opacity:0.7; font-style:italic; }
.solo-status { margin-top:10px; font-size:13px; opacity:0.85; }
.solo-act { margin-top:12px; font-size:13px; }
.solo-act .a-det { display:block; font-size:11px; opacity:0.6; }
.back { position:fixed; top:18px; left:18px; z-index:60; color:#5a6472; text-decoration:none; font-size:0.8rem; }
.back:hover { color:#fff; }

</style>
</head>
<body>
  <!-- PER PERSON: change data-user-id, data-banner, data-music on #stage -->
  <div class="bg" id="bg"></div>

  <div id="intro-panel" class="intro-panel active">
    <div class="intro-content">
      <div class="terminal-header" aria-hidden="true">
        <span class="terminal-dot"></span>
        <span class="terminal-dot"></span>
        <span class="terminal-dot"></span>
        <span class="terminal-title">~/otfxo/world</span>
        <span class="terminal-badge">SH</span>
      </div>
      <div class="intro-logo">
        <img src="https://file.garden/ap_Ebnzi9V7bLTDs/690967A0-5D9F-49B7-A53F-CCA5D276A296.png" alt="logo">
      </div>
      <div class="intro-text-box">
        <div class="code-gutter"></div>
        <p class="intro-typewriter"></p>
      </div>
      <button class="intro-proceed" disabled="">ENTER</button>
    </div>
  </div>

  <a class="back" href="index.html">&larr; back</a>

  <div class="stage" id="stage"
       data-user-id="1034804876733071382"
       data-banner="https://file.garden/ap_Ebnzi9V7bLTDs/aez.gif"
       data-music="https://file.garden/ap_Ebnzi9V7bLTDs/Janice%20STFU.mp3">
    <div class="solo-card">
      <div class="media-slot"><img class="media-img" id="media" src=""></div>
      <div class="solo-inner">
        <div class="solo-avatar"><img id="avatar" src=""><span class="solo-dot" id="dot"></span></div>
        <div class="solo-info">
          <div class="solo-name" id="name">…</div>
          <div class="solo-user" id="uname"></div>
          <div class="solo-status" id="statusBox"></div>
          <div class="solo-act"><span id="actName"></span><span class="a-det" id="actDet"></span></div>
        </div>
      </div>
    </div>
  </div>

  <audio id="music" loop></audio>

<script>
  /* ---- exact typewriter from the main site ---- */
  function typeWriter(element, text, speed = 40, callback = null, gutterElement = null) {
    const scrambleCharacters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%\u20ac&/.,<>';
    const characters = [...text];
    const okCharacterIndexes = new Set();
    for (const match of text.matchAll(/\[OK\]/g)) {
      const startIndex = match.index ?? -1;
      for (let offset = 0; offset < 4; offset++) okCharacterIndexes.add(startIndex + offset);
    }
    element.replaceChildren();
    element.classList.add('typing');
    let index = 0, gutterLineNumber = 1, gutterRowTop = null;
    if (gutterElement) {
      gutterElement.innerHTML = '';
      const s = document.createElement('span'); s.textContent = gutterLineNumber; gutterElement.appendChild(s);
    }
    function trackGutterRow(node) {
      if (!gutterElement) return;
      const rowTop = node.offsetTop;
      if (gutterRowTop === null) gutterRowTop = rowTop;
      else if (rowTop > gutterRowTop) {
        gutterLineNumber++;
        const s = document.createElement('span'); s.textContent = gutterLineNumber; gutterElement.appendChild(s);
        gutterRowTop = rowTop;
      }
    }
    function revealNext() {
      if (index >= characters.length) {
        element.classList.remove('typing');
        const c = document.createElement('span'); c.className = 'line-cursor'; element.appendChild(c);
        if (callback) callback();
        return;
      }
      const ch = characters[index];
      const node = document.createElement('span');
      node.className = 'scramble-character';
      if (ch === '\n') node.classList.add('scramble-break');
      if (okCharacterIndexes.has(index)) node.classList.add('ok-character');
      element.appendChild(node);
      if (ch === ' ' || ch === '\n') { node.textContent = ch === '\n' ? '' : ch; trackGutterRow(node); index++; setTimeout(revealNext, speed); return; }
      node.classList.add('letter-shake');
      let tick = 0; const ticks = 2, st = Math.max(10, Math.floor(speed/2));
      const iv = setInterval(() => {
        node.textContent = scrambleCharacters[Math.floor(Math.random()*scrambleCharacters.length)];
        if (++tick >= ticks) { clearInterval(iv); node.textContent = ch; node.classList.remove('letter-shake'); trackGutterRow(node); index++; setTimeout(revealNext, speed); }
      }, st);
    }
    revealNext();
  }

  const stage = document.getElementById('stage');
  const id = stage.dataset.userId;
  const banner = stage.dataset.banner;
  document.getElementById('bg').style.backgroundImage = `url('${banner}')`;
  document.getElementById('media').src = banner;
  const music = document.getElementById('music');
  music.src = stage.dataset.music; music.volume = 0.5;

  const panel = document.getElementById('intro-panel');
  const content = document.querySelector('.intro-content');
  const tw = document.querySelector('.intro-typewriter');
  const gutter = document.querySelector('.code-gutter');
  const btn = document.querySelector('.intro-proceed');

  window.addEventListener('load', () => {
    typeWriter(tw, '\uD835\uDDE2\uD835\uDDE7\uD835\uDDD9\uD835\uDDEB\uD835\uDDE2', 80, () => {
      btn.style.display = 'block'; btn.disabled = false;
    });
    btn.addEventListener('click', () => {
      if (!content.classList.contains('console-mode')) {
        content.classList.add('console-mode');
        btn.disabled = true; btn.style.display = 'none';
        const consoleText = `$ ssh otfxo@world --user=guest
connecting...
[OK] handshake complete
$ otfxoctl status
scanning the family...
[OK] 1 otfxo counted
[OK] 1 otfxo awake
$ client info
[OK] loading profile...
$ enter otfxo_world
> welcome`;
        typeWriter(tw, consoleText, 14, () => {
          setTimeout(() => {
            panel.classList.add('hidden');
            stage.classList.add('show');
            music.play().catch(()=>{});
          }, 700);
        }, gutter);
      }
    });
  });

  async function load() {
    try {
      const j = await (await fetch(`https://api.lanyard.rest/v1/users/${id}`)).json();
      if (!j.success) { document.getElementById('name').textContent = 'Unknown'; return; }
      const u = j.data, du = u.discord_user;
      document.getElementById('avatar').src = du.avatar ? `https://cdn.discordapp.com/avatars/${id}/${du.avatar}.png?size=256` : 'https://cdn.discordapp.com/embed/avatars/0.png';
      document.getElementById('name').textContent = du.global_name || du.username || 'Unknown';
      document.getElementById('uname').textContent = '@' + (du.username || '');
      document.getElementById('dot').className = `solo-dot status-${u.discord_status || 'offline'}`;
      document.getElementById('statusBox').textContent = u.activities?.find(a=>a.type===4)?.state || '';
      const act = u.activities?.find(a=>a.type!==4 && a.name!=='Spotify');
      document.getElementById('actName').textContent = act?.name || '';
      document.getElementById('actDet').textContent = act ? [act.details, act.state].filter(Boolean).join(' \u2014 ') : '';
    } catch { document.getElementById('name').textContent = 'Unknown'; }
  }
  load(); setInterval(load, 15000);
</script>
</body>
